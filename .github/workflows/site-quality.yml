name: Site quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - name: Checkout repository without marketplace actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${HEAD_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Install and select Node.js 22
        shell: bash
        run: |
          if [ -s "${NVM_DIR}/nvm.sh" ]; then
            . "${NVM_DIR}/nvm.sh"
            nvm install 22
            nvm use 22
          else
            echo "NVM is unavailable on this runner." >&2
            exit 1
          fi
          node --version
          npm --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate static and server builds
        run: npm run check

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Visually validate GitHub Pages mirror
        run: node scripts/static-visual-smoke.mjs

      - name: Run browser regression suite
        run: npm run test:e2e

      - name: Retain prelaunch visual matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corporatex-prelaunch-visual-matrix-${{ github.run_number }}
          path: |
            test-results/prelaunch-matrix
            prelaunch-artifacts/github-pages
          if-no-files-found: warn
          retention-days: 14
